
Отправлено с iPhone
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеоуроки по макияжу</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
        }
        h2, h3 {
            text-align: center;
        }
        .tab-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 12px;
            padding: 4px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .tab.active {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .lesson-card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .lesson-card h4 {
            margin: 0 0 8px 0;
        }
        .lesson-card p {
            margin: 0 0 12px 0;
            font-size: 14px;
            opacity: 0.8;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        .video-container iframe, .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Админ-панель */
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            opacity: 0.7;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="tab-bar">
        <div class="tab active" onclick="switchTab('lessons')">📚 Уроки</div>
        <div id="adminTabBtn" class="tab hidden" onclick="switchTab('admin')">⚙️ Админка</div>
    </div>

    <!-- Вкладка с уроками -->
    <div id="lessonsTab">
        <h2>💄 Видеоуроки по макияжу</h2>
        <div id="lessonsList">
            <!-- Сюда динамически подгружаются уроки -->
        </div>
    </div>

    <!-- Вкладка админа для загрузки уроков -->
    <div id="adminTab" class="hidden">
        <h3>Добавить новый урок</h3>
        <div class="form-group">
            <label>Название урока:</label>
            <input type="text" id="lessonTitle" placeholder="Например: Идеальные стрелки">
        </div>
        <div class="form-group">
            <label>Описание:</label>
            <textarea id="lessonDesc" rows="3" placeholder="Краткое описание того, чему научится ученик"></textarea>
        </div>
        <div class="form-group">
            <label>Ссылка на видео (YouTube / Embed / MP4):</label>
            <input type="text" id="lessonUrl" placeholder="https://www.youtube.com/embed/...">
        </div>
        <button class="btn" onclick="addNewLesson()">Опубликовать урок</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ЗАМЕНИТЕ ЭТОТ ID НА ВАШ TELEGRAM ID (чтобы админка была доступна только вам)
        const ADMIN_ID = 123456789;

        // Проверяем, админ ли пользователь
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            if (tg.initDataUnsafe.user.id === ADMIN_ID) {
                document.getElementById('adminTabBtn').classList.remove('hidden');
            }
        }

        // Базовые уроки по умолчанию
        let lessons = JSON.parse(localStorage.getItem('makeup_lessons')) || [
            {
                title: "Базовый тон и подготовка кожи",
                desc: "Учимся подготавливать лицо, наносить базу и ровный тон без эффекта маски.",
                url: "https://www.youtube.com/embed/dQw4w9WgXcQ" // Пример ссылки
            },
            {
                title: "Дневной макияж за 10 минут",
                desc: "Быстрый и свежий образ на каждый день.",
                url: "https://www.youtube.com/embed/dQw4w9WgXcQ"
            }
        ];

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (tabName === 'lessons') {
                document.getElementById('lessonsTab').classList.remove('hidden');
                document.getElementById('adminTab').classList.add('hidden');
                event.target.classList.add('active');
                renderLessons();
            } else {
                document.getElementById('lessonsTab').classList.add('hidden');
                document.getElementById('adminTab').classList.remove('hidden');
                event.target.classList.add('active');
            }
        }

        function renderLessons() {
            const container = document.getElementById('lessonsList');
            container.innerHTML = '';
            
            if (lessons.length === 0) {
                container.innerHTML = '<p style="text-align:center; opacity:0.6;">Уроков пока нет.</p>';
                return;
            }

            lessons.forEach((lesson, index) => {
                container.innerHTML += `
                    <div class="lesson-card">
                        <h4>${index + 1}. ${lesson.title}</h4>
                        <p>${lesson.desc}</p>
                        <div class="video-container">
                            <iframe src="${lesson.url}" allowfullscreen></iframe>
                        </div>
                    </div>
                `;
            });
        }

        function addNewLesson() {
            const title = document.getElementById('lessonTitle').value.trim();
            const desc = document.getElementById('lessonDesc').value.trim();
            let url = document.getElementById('lessonUrl').value.trim();

            if (!title || !url) {
                alert('Заполните название и ссылку на видео!');
                return;
            }

            // Автоматическое преобразование обычной ссылки YouTube в Embed-формат, если нужно
            if (url.includes('watch?v=')) {
                url = url.replace('watch?v=', 'embed/');
            }

            lessons.push({ title, desc, url });
            localStorage.setItem('makeup_lessons', JSON.stringify(lessons));

            // Очищаем форму и переходим на вкладку уроков
            document.getElementById('lessonTitle').value = '';
            document.getElementById('lessonDesc').value = '';
            document.getElementById('lessonUrl').value = '';
            
            alert('Урок успешно добавлен!');
            switchTab('lessons');
        }

        // Первичный вывод уроков
        renderLessons();
    </script>
</body>
</html>
